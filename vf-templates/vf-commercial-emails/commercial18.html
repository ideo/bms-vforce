<apex:page >

  <!-- Define product type once -->
  <apex:variable var="productType" value="commercial"/>
  
  <!-- Global Styles -->
  <c:emailStyles />

  <!-- GLOBAL WRAPPER -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="width:100%; background-color:#ffffff; margin:0; padding:0;">
    <tr>
      <td align="center" style="padding:0 8px;">

        <!-- ======== START EMAIL CONTENT ======== -->

        <!-- Spacer -->
        <c:spacer height="8"/>

        <!-- Logo -->
        <c:emailLogo />

        <!-- Spacer -->
        <c:spacer height="8"/>

        <!-- HERO CARD WITH ACTION -->
        <c:heroCard productType="{!productType}"
        
          illustrationSrc="https://bms-emails.s3.us-east-1.amazonaws.com/final-assets/illustrations/commercial/delivered.png"
          headline="Please confirm your patient BP’s Breyanzi administration date."
          subcopy=""
          buttonText="Confirm Product Administration Date"
          buttonLink="https://www.ct360.com/s/login/?language=en_US&ec=302&startURL=%2Fs%2F"
        
          enrollmentId="ENR-013411"
          joinId="9P95-51M67"
          patientInitials="BP"
          physician="Alexander Harrington"
        
          showProgressBar="true"
          progressDesktopSrc="https://bms-emails.s3.us-east-1.amazonaws.com/final-assets/progress-bars/commercial/delivered-web.png"
          progressMobileSrc="https://bms-emails.s3.us-east-1.amazonaws.com/final-assets/progress-bars/commercial/delivered-mobile.png"
        />
        
        <!-- Spacer -->
        <c:spacer height="8"/>
            
        <c:emailFooter productType="{!productType}"
          phoneLinkHref="https://celltherapy360.com/contact"
          phoneLinkText="Global Phone Numbers"
          loginHref="https://www.ct360.com/s/login"
          manageHref="https://www.ct360.com/preferences"
        />
                
        
        <!-- ======== END EMAIL CONTENT ======== -->
      </td>
    </tr>
  </table>
</apex:page>
