<apex:page >

  <!-- Define product type once -->
  <apex:variable var="productType" value="security"/>
  
  <!-- Global Styles -->
  <c:emailStyles />

  <!-- GLOBAL WRAPPER -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="width:100%; background-color:#ffffff; margin:0; padding:0;">
    <tr>
      <td align="center" style="padding:0 8px;">

        <!-- ======== START EMAIL CONTENT ======== -->

        <!-- Spacer -->
        <c:spacer height="8"/>

        <!-- Logo -->
        <c:emailLogo />

        <!-- Spacer -->
        <c:spacer height="8"/>

        <!-- HEADER -->
        <c:heroCard productType="{!productType}"
        
          illustrationSrc="https://bms-emails.s3.us-east-1.amazonaws.com/illustrations/security.png"
          headline="Verify your identity."
          subcopy="To ensure your account’s security enter the following code where prompted in the portal."
          buttonText="Log In to Cell Therapy 360 Portal"
          buttonLink="https://www.ct360.com/s/login/?language=en_US&ec=302&startURL=%2Fs%2F"

          securityLabel="Verification Code"
          securityValue="2309"
        
          showProgressBar="false"
        />

        <!-- Spacer -->
        <c:spacer height="8"/>
        
        
        <c:banner bannerType="warning"
          text="If you didn’t attempt this action in the Portal, or you don’t recognize this browser or operating system, contact Cell Therapy 360."
          iconSrc="https://bms-emails.s3.us-east-1.amazonaws.com/icon-warning-triangle.png"
          iconAlt="Warning Icon"
        />
          
        <!-- Spacer -->
        <c:spacer height="8"/>
        
        <!-- Security Details Section -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               class="container cap-682 web round-12"
               style="max-width:682px; margin:0 auto; background-color:#F5F5F5; border-radius:12px;">
          <tr>
            <td style="padding:20px;">
        
              <!-- Section Header -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="color:#144A8E; font-size:14px; font-family:Avenir, Arial, sans-serif; font-weight:500; padding-bottom:20px; line-height:32px;">
                    Action Details
                  </td>
                </tr>
              </table>
        
              <!-- Row 1 -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                     style="table-layout:fixed; border-collapse:collapse;">
                <tr valign="top" style="vertical-align:top;">
                  <!-- Card 1 -->
                  <td class="col-50" style="padding-bottom:16px; padding-right:20px;">
                    <c:infoCard productType="{!productType}"
                      iconSrc="https://bms-emails.s3.us-east-1.amazonaws.com/final-assets/icons/commercial/devices.png"
                      iconAlt="Operating System"
                      dataText="9P95-51M67"
                      labelText="Operating System"
                    />
                  </td>
        
                  <!-- Card 2 -->
                  <td class="col-50 col-right--tight" style="padding-bottom:16px; padding-left:0;">
                    <c:infoCard productType="{!productType}"
                      iconSrc="https://bms-emails.s3.us-east-1.amazonaws.com/final-assets/icons/commercial/contact-person.png"
                      iconAlt="Username"
                      dataText="johndeerdoejane"
                      labelText="Username"
                    />
                  </td>
                </tr>
              </table>
        
              <!-- Row 2 -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                     style="table-layout:fixed; border-collapse:collapse;">
                <tr valign="top" style="vertical-align:top;">
                  <!-- Card 3 -->
                  <td class="col-50" style="padding-bottom:16px; padding-right:20px;">
                    <c:infoCard productType="{!productType}"
                      iconSrc="https://bms-emails.s3.us-east-1.amazonaws.com/final-assets/icons/commercial/browser.png"
                      iconAlt="Browser"
                      dataText="Chrome"
                      labelText="Browser"
                    />
                  </td>
        
                  
                </tr>
              </table>

            </td>
          </tr>
        </table>
        <!-- End of Security Details Section -->
        
        <!-- Spacer -->
        <c:spacer height="8"/>
        
        <c:emailFooter productType="{!productType}"
          phoneLinkHref="https://celltherapy360.com/contact"
          phoneLinkText="Global Phone Numbers"
          loginHref="https://www.ct360.com/s/login"
          manageHref="https://www.ct360.com/preferences"
        />

        
        <!-- ======== END EMAIL CONTENT ======== -->
      </td>
    </tr>
  </table>
</apex:page>
